name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    environment: PHP

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Require patched PHP
        run: |
          php -r '$minimums = ["8.2" => "8.2.35", "8.3" => "8.3.36", "8.4" => "8.4.27", "8.5" => "8.5.12"]; $minor = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION; echo "PHP " . PHP_VERSION . PHP_EOL; exit(isset($minimums[$minor]) && version_compare(PHP_VERSION, $minimums[$minor], ">=") ? 0 : 1);'

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit --configuration phpunit.xml.dist

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration --configuration phpunit.xml.dist
        env:
          MYGEOTAB_USERNAME: ${{ secrets.MYGEOTAB_USERNAME }}
          MYGEOTAB_PASSWORD: ${{ secrets.MYGEOTAB_PASSWORD }}
          MYGEOTAB_DATABASE: ${{ secrets.MYGEOTAB_DATABASE }}
          MYGEOTAB_SERVER: ${{ secrets.MYGEOTAB_SERVER }}
