name: Release

on:
  push:
    tags: ['*']

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Require patched PHP
        run: |
          php -r '$minimums = ["8.2" => "8.2.35", "8.3" => "8.3.36", "8.4" => "8.4.27", "8.5" => "8.5.12"]; $minor = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION; echo "PHP " . PHP_VERSION . PHP_EOL; exit(isset($minimums[$minor]) && version_compare(PHP_VERSION, $minimums[$minor], ">=") ? 0 : 1);'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit --configuration phpunit.xml.dist

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
